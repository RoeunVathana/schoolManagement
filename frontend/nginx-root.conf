worker_processes auto;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; worker-src 'self' blob:;" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    client_max_body_size 260m;

    root /usr/share/nginx/html;
    index index.html;

    # Keep Firebase's sign-in helper on the same origin as the app. This avoids
    # third-party storage restrictions during signInWithRedirect on custom domains.
    location ^~ /__/auth/ {
      # Firebase's helper uses a small inline bootstrap script and an iframe.
      # Keep this exception scoped to the helper paths only; the app keeps the
      # stricter site-wide CSP below.
      add_header X-Frame-Options "" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.google.com; worker-src 'self' blob:;" always;
      proxy_pass https://shoolmanagement-65b53.firebaseapp.com;
      proxy_ssl_server_name on;
      proxy_ssl_name shoolmanagement-65b53.firebaseapp.com;
      proxy_set_header Host shoolmanagement-65b53.firebaseapp.com;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /__/firebase/init.json {
      proxy_pass https://shoolmanagement-65b53.firebaseapp.com;
      proxy_ssl_server_name on;
      proxy_ssl_name shoolmanagement-65b53.firebaseapp.com;
      proxy_set_header Host shoolmanagement-65b53.firebaseapp.com;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
