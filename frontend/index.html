<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10243f" />
    <style id="campusflow-boot-style">
      /* Keep the first paint clean while the React bundle and route styles load. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f8ff;
      }

      html.dark,
      html.dark body {
        background: #0b1526;
      }

      html:not(.campusflow-app-ready) {
        overflow: hidden;
      }

      html:not(.campusflow-app-ready) #root {
        visibility: hidden;
      }

      #campusflow-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #f6f8ff;
      }

      html.dark #campusflow-boot {
        background: #0b1526;
      }

      #campusflow-boot span {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(34, 158, 217, 0.2);
        border-top-color: #229ed9;
        border-radius: 50%;
        animation: campusflow-boot-spin 0.8s linear infinite;
      }

      @keyframes campusflow-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      html.campusflow-app-ready #campusflow-boot {
        display: none;
      }

      html.campusflow-app-ready #root {
        visibility: visible;
      }
    </style>
    <script>
      window.__campusflowBootReady = () => {
        window.clearTimeout(window.__campusflowBootTimeout);
        document.documentElement.classList.add('campusflow-app-ready');
        document.getElementById('campusflow-boot')?.remove();
      };

      // Never leave a public page behind an infinite first-paint spinner.
      window.__campusflowBootTimeout = window.setTimeout(() => {
        window.__campusflowBootReady?.();
      }, 4000);
    </script>
    <script>
      (() => {
        try {
          if (localStorage.getItem('sms_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch {}
      })();
    </script>
